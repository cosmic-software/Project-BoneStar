<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Assets tab</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: rgba(20, 22, 30, 0.92);
    color: #e0e0e0;
    overflow: hidden;
  }
  button {
    width: 100%; height: 100%;
    background: none; border: none; color: inherit; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    font: inherit; font-size: 13px; letter-spacing: 0.08em;
  }
  button:hover { background: rgba(255, 255, 255, 0.06); }
  .label { writing-mode: vertical-rl; transform: rotate(180deg); }
  .arrow { font-size: 14px; color: #7fb2ff; }
</style>
</head>
<body>
  <button id="tab" title="Show or hide the asset list">
    <span class="arrow" id="arrow">&#9656;</span>
    <span class="label">ASSETS</span>
  </button>
<script>
  // Messages go to the world script's OnPanelMessage (see index.veml on-message).
  function sendToWorld(data) {
    var msg = JSON.stringify(data);
    if (window.vuplex) {
      window.vuplex.postMessage(msg);
    } else if (window.parent !== window) {
      window.parent.postMessage({ type: 'vuplex.postMessage', message: msg }, '*');
    }
  }

  // Called by the world (ExecuteJavaScript) so the arrow shows open/closed.
  function setOpen(open) {
    document.getElementById('arrow').innerHTML = open ? '&#9656;' : '&#9666;';
  }

  document.getElementById('tab').addEventListener('click', function () {
    sendToWorld({ type: 'toggle-assets' });
  });
</script>
</body>
</html>
