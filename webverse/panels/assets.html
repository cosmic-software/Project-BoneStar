<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Assets</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: rgba(20, 22, 30, 0.92);
    color: #e0e0e0;
    padding: 14px;
    overflow: hidden;
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    border-bottom: 1px solid rgba(127, 178, 255, 0.3);
    padding-bottom: 8px; margin-bottom: 10px;
  }
  h1 { font-size: 16px; font-weight: 600; color: #7fb2ff; letter-spacing: 0.04em; }
  .close {
    background: none; border: none; color: #888; font-size: 18px; line-height: 1; cursor: pointer;
  }
  .close:hover { color: #ddd; }
  ul { list-style: none; }
  li button {
    width: 100%; text-align: left; cursor: pointer;
    background: none; border: 1px solid transparent; border-radius: 4px;
    color: #ddd; font: inherit; font-size: 13px;
    padding: 8px 10px; margin-bottom: 4px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  li button:hover { background: rgba(255, 255, 255, 0.06); }
  li button.selected { border-color: rgba(127, 178, 255, 0.6); background: rgba(127, 178, 255, 0.12); }
  .kind { font-size: 11px; color: #888; }
  .hint { margin-top: 12px; font-size: 11px; color: #888; line-height: 1.6; }
</style>
</head>
<body>
  <header>
    <h1>Assets</h1>
    <button class="close" id="close" title="Close">&times;</button>
  </header>
  <ul id="list">
    <li><button data-tag="Earth" class="selected"><span>Earth</span><span class="kind">body</span></button></li>
    <li><button data-tag="25544"><span>ISS</span><span class="kind">spacecraft</span></button></li>
    <li><button data-tag="20580"><span>Hubble</span><span class="kind">spacecraft</span></button></li>
  </ul>
  <p class="hint">Select an asset to centre the view on it.<br>Drag to orbit &middot; W/S to zoom &middot; R resets</p>
<script>
  // Messages go to the world script's OnPanelMessage (see index.veml on-message).
  function sendToWorld(data) {
    var msg = JSON.stringify(data);
    if (window.vuplex) {
      window.vuplex.postMessage(msg);
    } else if (window.parent !== window) {
      window.parent.postMessage({ type: 'vuplex.postMessage', message: msg }, '*');
    }
  }

  // Called by the world (ExecuteJavaScript) after it changes focus, so the list
  // always shows what the camera is really centred on (R also changes it).
  function setSelected(tag) {
    var buttons = document.querySelectorAll('#list button');
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].classList.toggle('selected', buttons[i].getAttribute('data-tag') === tag);
    }
  }

  document.getElementById('list').addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (btn) {
      sendToWorld({ type: 'select-asset', tag: btn.getAttribute('data-tag') });
    }
  });
  document.getElementById('close').addEventListener('click', function () {
    sendToWorld({ type: 'toggle-assets' });
  });
</script>
</body>
</html>
